spring.datasource.url=${AL_DB_URL}
spring.datasource.username=${AL_DB_USER_NAME}
spring.datasource.password=${AL_DB_PASSWORD}

# Small pool; let idle connections close so Neon's sleep doesn't leave stale ones
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.main.lazy-initialization=true

app.security.jwt.secret=${JWT_SECRET}

# Same-origin in production, but keep this so the proxy can't cause CORS rejections
app.cors.allowed-origin-patterns=${APP_ORIGIN}
server.forward-headers-strategy=framework

# Disable Swagger in production for security reasons
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false