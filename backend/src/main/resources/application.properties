spring.application.name=ApartmentLedger
server.port=${PORT:8081}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT (the secret itself lives in the profile files)
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator: health only by default
management.endpoints.web.exposure.include=health
management.metrics.web.server.request.autotime.enabled=true
management.metrics.web.server.request.metric-name=http.server.requests

# Logging
logging.level.org.zalando.logbook.Logbook=INFO
logbook.format.style=json
logbook.exclude[0]=/actuator/**
logbook.exclude[1]=/swagger-ui/**
logbook.exclude[2]=/v3/api-docs/**
logbook.obfuscate.headers[0]=Authorization
logbook.obfuscate.headers[1]=X-Api-Key
logbook.obfuscate.json-body-fields[0]=password
logbook.obfuscate.json-body-fields[1]=token
logbook.obfuscate.json-body-fields[2]=secret
logbook.obfuscate.json-body-fields[3]=credit_card

# CORS (the allowed origins are set per profile)
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true